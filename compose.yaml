services:
  web:
    build:
      context: .
      dockerfile: dockerfile
    image: containerizationtest:latest
    container_name: containerizationtest
    ports:
      - "8080:8080"   # host:container -> http://localhost:8080
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
    restart: unless-stopped
